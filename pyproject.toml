[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-crime-detection"
version = "0.1.0"
description = "Real-time crime detection through video enhancement in adverse weather and low-light environments"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "performer-pytorch>=1.1.4",
    "flask>=3.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "fvcore>=0.1.5",
    "iopath>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
extract = ["av>=10", "pytorchvideo @ git+https://github.com/facebookresearch/pytorchvideo.git"]

[tool.setuptools.packages.find]
include = ["capstone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
