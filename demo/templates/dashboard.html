<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Streaming Dashboard</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            height: 100vh;
        }
        .streams {
            background: #111;
            display: grid;
            grid-template-rows: 50% 50%;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            padding: 10px;
            height: 100vh;
            box-sizing: border-box;
        }
        .stream-box {
            background: #000;
            border: 2px solid #333;
            height: 100%;
            box-sizing: border-box;
        }
        .stream-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .sidebar {
            background: #f3f3f3;
            height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            justify-content: space-between;
        }
        .log {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            background: #fff;
            padding: 10px;
            font-size: 14px;
        }
        .footer {
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="streams">
        {% for key in stream_keys %}
        <div class="stream-box"><img src="/stream/{{ key }}" alt="{{ key }}"></div>
        {% endfor %}
    </div>
    <div class="sidebar">
        <div>
            <h3>Log</h3>
            <div class="log" id="log-box"></div>
        </div>
        <div class="footer">
            <p><strong>Date/Time:</strong> <span id="datetime"></span></p>
            <p><strong>Location:</strong> {{ location }}</p>
        </div>
    </div>
</div>

<script>
    const logBox = document.getElementById('log-box');
    const maxLogs = {{ max_logs }};

    const evtSource = new EventSource('/log_stream');

    evtSource.onmessage = function(event) {
        const newLog = document.createElement('p');
        newLog.textContent = event.data;
        logBox.insertBefore(newLog, logBox.firstChild);
        while (logBox.childElementCount > maxLogs) {
            logBox.removeChild(logBox.lastChild);
        }
    };

    // Do not close() here: EventSource reconnects on its own after a server restart.
    evtSource.onerror = function() {
        console.warn("로그 스트림 연결 끊김, 재연결 대기 중");
    };

    function updateDateTime() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-GB');
        const timeStr = now.toLocaleTimeString('en-GB', { hour12: false });
        document.getElementById('datetime').innerText = `${dateStr} ${timeStr}`;
    }
    setInterval(updateDateTime, 1000);
    window.onload = updateDateTime;
</script>
</body>
</html>
